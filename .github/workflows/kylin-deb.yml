# Kylin V20 / UOS deb packages: the glibc-2.31 baseline build that packaging/linux/package.sh
# cannot provide (it builds on Ubuntu 22.04 and needs glibc >= 2.35). See
# packaging/linux/kylin/README.md for what ships and why.
#
# Native runners (no cross compilation) inside a Debian bullseye container, following the
# deepin-screenshot packaging workflow. Pushes to main build automatically (as that repo's
# master does); a v* tag also attaches the debs to the tag's release; any branch can be built
# on demand through workflow_dispatch.
name: Kylin deb

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kylin-deb-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-deb:
    name: Build kylin-${{ matrix.osarch }} debs
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            osarch: amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            osarch: aarch64
    # Native runners produce native builds. The container sets the glibc baseline: bullseye is
    # 2.31, exactly Kylin V20's (Ubuntu 20.04 base, glibc 2.31-0kylin), and everything newer
    # (UOS/deepin, Debian 11+) accepts the binaries too.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    container: debian:bullseye-slim
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Point bullseye-security at the Debian archive
        run: |
          set -e
          # bullseye has left regular security support: deb.debian.org still serves the
          # bullseye-security package index (apt-get update succeeds), but the .debs in its
          # pool are gone (installs 404). Keep main on the fast deb.debian.org mirror and
          # point only the security suite at archive.debian.org — the whole archive mirror
          # rate-limits cloud runner IPs, which fails in harder-to-diagnose ways.
          sed -i 's|http://security.debian.org|http://archive.debian.org|g; s|http://deb.debian.org/debian-security|http://archive.debian.org/debian-security|g' /etc/apt/sources.list
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99no-valid-until
          cat /etc/apt/sources.list

      - name: Install build dependencies
        run: |
          set -o pipefail
          {
            set -e
            for attempt in 1 2 3 4; do
              if apt-get update; then
                break
              fi
              echo "apt-get update failed (attempt $attempt), retrying in 20s" >&2
              if [ "$attempt" = "4" ]; then
                exit 1
              fi
              sleep 20
            done
            for attempt in 1 2 3; do
              if apt-get install -y --no-install-recommends -o Acquire::Retries=5 \
                build-essential cmake perl pkg-config git curl ca-certificates nasm dpkg-dev libclang-dev; then
                break
              fi
              echo "apt-get install failed (attempt $attempt), retrying in 30s" >&2
              if [ "$attempt" = "3" ]; then
                exit 1
              fi
              sleep 30
            done
          } 2>&1 | tee build-deps.log

      - name: Install Rust
        # Debian bullseye ships rustc 1.63, far below the workspace rust-version (1.95);
        # rustup's own binaries run on glibc 2.17.
        run: |
          set -e
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Trust the checkout directory for git
        # In the container the workspace is owned by a different uid than the step user, and
        # env.sh records the build SHA through git.
        run: git config --global --add safe.directory '*'

      - name: Clone craft-fonts (pinned, same ref as release.yml)
        run: |
          set -e
          git init -q /tmp/craft-fonts
          git -C /tmp/craft-fonts remote add origin https://github.com/storytold/craft-fonts.git
          git -C /tmp/craft-fonts fetch -q --depth 1 origin 3d9ab3a132ed0eff457e424226a435a901da30d3
          git -C /tmp/craft-fonts checkout -q --detach FETCH_HEAD
          echo "CRAFT_FONTS_DIR=/tmp/craft-fonts" >> "$GITHUB_ENV"

      - name: Build and package
        run: |
          set -o pipefail
          # bash -x traces every shell command with PS4 line numbers into the log, so a
          # silent set -e death (no error text of its own) still names the failing line.
          export PS4='+L$LINENO: '
          bash -x packaging/linux/kylin/package.sh 2>&1 | tee kylin-build.log

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdfcraft-kylin-${{ matrix.osarch }}
          path: dist/release/pdfcraft-*-kylin-*.deb
          if-no-files-found: error

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pdfcraft-kylin-${{ matrix.osarch }}-logs
          path: |
            build-deps.log
            kylin-build.log
          if-no-files-found: ignore

      - name: Emit format and clippy findings as annotations
        # Once per run (amd64): the workspace is already compiled above, so clippy is quick,
        # and check-run annotations are the only finding channel readable without credentials.
        # Every grep tolerates no match (with -eo pipefail an unmatched grep would fail the
        # step and cut the later findings off).
        if: failure() || matrix.arch == 'amd64'
        run: |
          cargo fmt --check > /tmp/fmt.txt 2>&1 || true
          cargo clippy --workspace --all-targets > /tmp/clippy.txt 2>&1 || true
          n=0
          while IFS= read -r line; do
            n=$((n + 1)); [ "$n" -gt 10 ] && break
            printf '::error title=fmt L%d::%s\n' "$n" "$line"
          done < /tmp/fmt.txt
          n=0
          { grep -E '^error(\[|:)' /tmp/clippy.txt || true; } | head -10 | while IFS= read -r line; do
            printf '::error title=clippy::%s\n' "$line"
          done
          n=0
          { grep '^warning: ' /tmp/clippy.txt || true; } | head -10 | while IFS= read -r line; do
            printf '::warning title=clippy::%s\n' "$line"
          done
          echo "fmt: $(wc -l < /tmp/fmt.txt) diff lines, clippy: $(grep -cE '^(warning|error)' /tmp/clippy.txt || true) findings"

      - name: Re-emit the failing build log tail as annotations
        if: failure()
        run: |
          # The logs API answers 401/403 to anonymous readers and the job page loads
          # its log client-side, but check-run annotations are public API. GitHub
          # caps annotations at 10 per level per step, so the last 30 lines go out
          # as 10 notice + 10 warning + 10 error, oldest first; every title carries
          # its distance from the end, since identical annotations are merged. The
          # full traced log stays available as the *-logs artifact.
          f=kylin-build.log
          [ -f "$f" ] || exit 0
          tail -n 30 "$f" > /tmp/kylin-tail.txt
          {
            echo "### tail of \`$f\`"
            echo '```'
            cat /tmp/kylin-tail.txt
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          total=$(wc -l < /tmp/kylin-tail.txt)
          i=0
          while IFS= read -r line; do
            i=$((i + 1))
            from_end=$((total - i + 1))
            if [ "$from_end" -le 10 ]; then kind=error
            elif [ "$from_end" -le 20 ]; then kind=warning
            else kind=notice
            fi
            printf '::%s title=%s L%d-from-end::%s\n' "$kind" "$f" "$from_end" "$(printf '%s' "$line" | cut -c1-300)"
          done < /tmp/kylin-tail.txt

  build-msi:
    name: Build Windows ${{ matrix.arch }} MSI
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
            rustup_arch: x86_64
          - arch: arm64
            runner: windows-11-arm
            rustup_arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Install Rust
        shell: pwsh
        run: |
          if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest "https://win.rustup.rs/${{ matrix.rustup_arch }}" -OutFile "$env:TEMP\rustup-init.exe"
            & "$env:TEMP\rustup-init.exe" -y --profile minimal
            Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.cargo\bin"
          }
      - name: Install WiX v5
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2
      - uses: actions/checkout@v4
      - name: Clone craft-fonts (pinned, same ref as release.yml)
        shell: pwsh
        run: |
          git init -q "$env:RUNNER_TEMP\craft-fonts"
          git -C "$env:RUNNER_TEMP\craft-fonts" remote add origin https://github.com/storytold/craft-fonts.git
          git -C "$env:RUNNER_TEMP\craft-fonts" fetch -q --depth 1 origin 3d9ab3a132ed0eff457e424226a435a901da30d3
          git -C "$env:RUNNER_TEMP\craft-fonts" checkout -q --detach FETCH_HEAD
          Add-Content $env:GITHUB_ENV "CRAFT_FONTS_DIR=$env:RUNNER_TEMP\craft-fonts"
      - name: Build and package
        shell: pwsh
        run: packaging/windows/package.ps1 -Arch ${{ matrix.arch }}
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdfcraft-windows-${{ matrix.arch }}
          path: |
            dist/release/pdfcraft-*-windows-*.msi
            dist/release/pdfcraft-*-windows-*-portable.zip
          if-no-files-found: error

  publish-release:
    name: Attach the packages to the tag's release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-deb, build-msi]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -e
          cat > release_notes.md <<'EOF'
          PdfCraft for Kylin V20 / UOS (glibc 2.31 baseline), amd64 + aarch64.

          - `pdfcraft-<version>-kylin-<arch>.deb` — regular package; a desktop system provides
            the runtime libraries the app loads at run time (X11/Wayland, xkbcommon, Vulkan/GL).
          - `pdfcraft-<version>-kylin-<arch>-offline.deb` — for minimal or offline machines:
            bundles the runtime dependency closure, the OCR models and the tesseract packages
            for Chinese recognition. After `dpkg -i`, the installer runs automatically (10s
            delay, journalctl -u pdfcraft-deps), or run
            `sudo /usr/share/pdfcraft/install-deps.sh` once.
          - `pdfcraft-<version>-windows-<arch>.msi` (+ portable zip) — Windows x64/ARM64
            installers for local testing.

          OCR: `en` uses the bundled models; `zh-hans` (Simplified Chinese, mixed
          Chinese/English pages included) runs the system's tesseract, which the offline deb
          carries. Activation is a free local registration marker: the app asks once at startup
          and stores the answer beside the installed files.

          Requires glibc >= 2.31: Kylin V20 / Ubuntu Kylin (Ubuntu 20.04 base), UOS/deepin
          desktops, Debian 11+. Older systems (UOS 20, glibc 2.28) are not supported — glibc
          cannot be bundled. The regular distro packages (AppImage, deb, rpm) need a newer
          glibc and live in the main release.
          EOF
          if gh release view "$TAG_NAME" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" --repo "$REPO" --clobber \
              assets/pdfcraft-*-kylin-*.deb assets/pdfcraft-*-windows-*.msi assets/pdfcraft-*-windows-*-portable.zip
          else
            gh release create "$TAG_NAME" --repo "$REPO" \
              --title "pdfcraft ${TAG_NAME#v} (Kylin)" \
              --notes-file release_notes.md \
              assets/pdfcraft-*-kylin-*.deb assets/pdfcraft-*-windows-*.msi assets/pdfcraft-*-windows-*-portable.zip
          fi
          ls -lh assets/
